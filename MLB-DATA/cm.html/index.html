<!DOCTYPE html>
<html>
<head>
    
    <title>DVC Plot</title>
    

    <script src="https://cdn.jsdelivr.net/npm/vega@5.20.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-lite@5.2.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/vega-embed@6.18.2"></script>
    
    <style>
        table {
            border-spacing: 15px;
        }
    </style>
</head>
<body>
    
    <div id = "dvc_yaml__live_plots_sklearn_confusion_matrix_json">
        <script type = "text/javascript">
            var spec = {"$schema": "https://vega.github.io/schema/vega-lite/v5.json", "data": {"values": [{"actual": "1", "predicted": "1", "rev": "workspace"}, {"actual": "1", "predicted": "1", "rev": "workspace"}, {"actual": "1", "predicted": "1", "rev": "workspace"}, {"actual": "1", "predicted": "1", "rev": "workspace"}, {"actual": "1", "predicted": "1", "rev": "workspace"}, {"actual": "-1", "predicted": "-1", "rev": "workspace"}, {"actual": "-1", "predicted": "-1", "rev": "workspace"}, {"actual": "-1", "predicted": "1", "rev": "workspace"}, {"actual": "-1", "predicted": "1", "rev": "workspace"}, {"actual": "-1", "predicted": "1", "rev": "workspace"}]}, "title": {"text": "Confusion Matrix", "anchor": "middle"}, "facet": {"column": {"field": "rev", "sort": []}, "row": {}}, "params": [{"name": "showValues", "bind": {"input": "checkbox"}}], "spec": {"transform": [{"aggregate": [{"op": "count", "as": "xy_count"}], "groupby": ["predicted", "actual"]}, {"impute": "xy_count", "groupby": ["rev", "predicted"], "key": "actual", "value": 0}, {"impute": "xy_count", "groupby": ["rev", "actual"], "key": "predicted", "value": 0}, {"joinaggregate": [{"op": "max", "field": "xy_count", "as": "max_count"}], "groupby": []}, {"calculate": "datum.xy_count / datum.max_count", "as": "percent_of_max"}], "encoding": {"x": {"field": "actual", "type": "nominal", "sort": "ascending", "title": "True Label"}, "y": {"field": "predicted", "type": "nominal", "sort": "ascending", "title": "Predicted Label"}}, "layer": [{"mark": "rect", "width": 300, "height": 300, "encoding": {"color": {"field": "xy_count", "type": "quantitative", "title": "", "scale": {"domainMin": 0, "nice": true}}}}, {"selection": {"label": {"type": "single", "on": "mouseover", "encodings": ["x", "y"], "empty": "none", "clear": "mouseout"}}, "mark": "rect", "encoding": {"tooltip": [{"field": "actual", "type": "nominal"}, {"field": "predicted", "type": "nominal"}, {"field": "xy_count", "type": "quantitative"}], "opacity": {"condition": {"selection": "label", "value": 1}, "value": 0}}}, {"transform": [{"filter": {"selection": "label"}}], "layer": [{"mark": {"type": "rect", "color": "lightpink"}}]}, {"mark": "text", "encoding": {"text": {"condition": {"param": "showValues", "field": "xy_count", "type": "quantitative"}}, "color": {"condition": {"test": "datum.percent_of_max > 0.5", "value": "white"}, "value": "black"}}}]}};
            vegaEmbed('#dvc_yaml__live_plots_sklearn_confusion_matrix_json', spec);
        </script>
    </div>
    

    <div id = "live_plots_sklearn_confusion_matrix_json">
        <script type = "text/javascript">
            var spec = {"$schema": "https://vega.github.io/schema/vega-lite/v5.json", "data": {"values": [{"actual": "1", "predicted": "1", "step": 0, "rev": "workspace"}, {"actual": "1", "predicted": "1", "step": 1, "rev": "workspace"}, {"actual": "1", "predicted": "1", "step": 2, "rev": "workspace"}, {"actual": "1", "predicted": "1", "step": 3, "rev": "workspace"}, {"actual": "1", "predicted": "1", "step": 4, "rev": "workspace"}, {"actual": "-1", "predicted": "-1", "step": 5, "rev": "workspace"}, {"actual": "-1", "predicted": "-1", "step": 6, "rev": "workspace"}, {"actual": "-1", "predicted": "1", "step": 7, "rev": "workspace"}, {"actual": "-1", "predicted": "1", "step": 8, "rev": "workspace"}, {"actual": "-1", "predicted": "1", "step": 9, "rev": "workspace"}]}, "title": {"text": "live/plots/sklearn/confusion_matrix.json", "anchor": "middle"}, "width": 300, "height": 300, "params": [{"name": "smooth", "value": 0.001, "bind": {"input": "range", "min": 0.001, "max": 1, "step": 0.001}}], "encoding": {"x": {"field": "step", "type": "quantitative", "title": "step"}, "color": {"field": "rev", "scale": {"domain": ["workspace"], "range": ["#945dd6"]}}, "strokeDash": {}}, "layer": [{"layer": [{"params": [{"name": "grid", "select": "interval", "bind": "scales"}], "mark": "line"}, {"transform": [{"filter": {"param": "hover", "empty": false}}], "mark": "point"}], "encoding": {"y": {"field": "predicted", "type": "quantitative", "title": "predicted", "scale": {"zero": false}}, "color": {"field": "rev", "type": "nominal"}}, "transform": [{"loess": "predicted", "on": "step", "groupby": ["rev"], "bandwidth": {"signal": "smooth"}}]}, {"mark": {"type": "line", "opacity": 0.2}, "encoding": {"x": {"field": "step", "type": "quantitative", "title": "step"}, "y": {"field": "predicted", "type": "quantitative", "title": "predicted", "scale": {"zero": false}}, "color": {"field": "rev", "type": "nominal"}}}, {"mark": {"type": "circle", "size": 10}, "encoding": {"x": {"aggregate": "max", "field": "step", "type": "quantitative", "title": "step"}, "y": {"aggregate": {"argmax": "step"}, "field": "predicted", "type": "quantitative", "title": "predicted", "scale": {"zero": false}}, "color": {"field": "rev", "type": "nominal"}}}, {"transform": [{"calculate": "datum.rev", "as": "pivot_field"}, {"pivot": "pivot_field", "op": "mean", "value": "predicted", "groupby": ["step"]}], "mark": {"type": "rule", "tooltip": {"content": "data"}, "stroke": "grey"}, "encoding": {"opacity": {"condition": {"value": 0.3, "param": "hover", "empty": false}, "value": 0}}, "params": [{"name": "hover", "select": {"type": "point", "fields": ["step"], "nearest": true, "on": "mouseover", "clear": "mouseout"}}]}]};
            vegaEmbed('#live_plots_sklearn_confusion_matrix_json', spec);
        </script>
    </div>
    
</body>
</html>
